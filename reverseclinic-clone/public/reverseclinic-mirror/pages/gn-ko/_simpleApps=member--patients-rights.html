<div style="font-size:20pt;font-family:나눔고딕;padding:10px 0px;">환자권리장전</div>

<textarea style="width:calc(100% - 20px);height:500px;padding:10px;line-height:150%;font-size:12pt;" readonly="">[환자의 권리]	
가. 진료받을 권리
환자는 자신의 건강보호와 증진을 위하여 적절한 보건의료서비스를 받을 권리를 갖고,
성별ㆍ나이ㆍ장애ㆍ종교ㆍ신념ㆍ신분 및 경제적 사정 등을 이유로 차별 받거나
건강에 관한 권리를 침해받지 아니하며, 의료인은 정당한 사유 없이 진료를 거부하지 못한다.
나. 알권리 및 자기결정권
환자는 담당 의사ㆍ간호사 등으로부터 질병 상태, 치료 방법, 의학적 연구 대상 여부, 장기이식 여부, 부작용 등
예상 결과 및 진료 비용에 관하여 충분한 설명을 듣고 자세히 물어볼 수 있으며,
이에 관한 동의 여부를 결정할 권리를 갖는다.
다. 비밀을 보호받을 권리
환자는 진료와 관련된 신체상ㆍ건강상의 비밀과 사생활의 비밀을 침해받지 아니하며,
의료인과 의료기관은 환자의 동의를 받거나 범죄 수사 등 법률에서 정한 경우 외에는
비밀을 누설ㆍ발표하지 못한다.
라. 상담ㆍ조정을 신청할 권리
환자는 병원 내에서 불만과 불편사항을 표현할 수 있으며, 의료서비스 관련 분쟁이 발생한 경우
한국소비자원 또는 한국의료분쟁조정중재원 등에 상담 및 조정 신청을 할 수 있다.
마. 신체적 안전을 보호받을 권리
환자는 병원 내 각종 위험으로부터 신체적 안전을 보호받을 권리가 있다.
[환자의 의무]	
가. 의료인에 대한 신뢰ㆍ존중 의무
환자는 자신의 건강 관련 정보를 의료인에게 정확히 알리고,
의료인의 치료 계획을 신뢰하고 존중하여야 한다.
나. 부정한 방법으로 진료를 받지 않을 의무
환자는 진료 전에 본인의 신분을 밝혀야 하고, 다른 사람의 명의로 진료를 받는 등
거짓이나 부정한 방법으로 진료를 받지 아니한다.
다. 병원의 공공질서와 병원 내규 준수 의무
환자는 다른 환자 및 직원의 권익을 보호하기 위해
공공질서와 병원의 내규를 준수해야 할 의무가 있다.</textarea>
